name: verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the 240 verification cases
        run: python examples/00_verify_all.py
      - name: Keep the verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.python-version }}
          path: results/*.csv
